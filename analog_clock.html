<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>擬真互動時鐘 (自定義版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #2c2c2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none; 
            -webkit-user-select: none;
        }

        /* 外框容器 */
        .clock-rim {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e0e0e0 0%, #a0a0a0 50%, #d0d0d0 100%);
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.5),
                inset 1px 1px 2px rgba(255,255,255,0.8),
                inset -1px -1px 2px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 時鐘盤面 */
        .clock-face {
            width: 290px;
            height: 290px;
            border-radius: 50%;
            background-color: #fcfcfc;
            /* 預設背景設定 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            box-shadow: 
                inset 5px 5px 15px rgba(0,0,0,0.2),
                inset -5px -5px 15px rgba(255,255,255,0.5);
            position: relative;
            cursor: grab;
            touch-action: none;
            overflow: hidden; /* 防止圖片溢出 */
        }

        .clock-face:active {
            cursor: grabbing;
        }

        /* 玻璃反光效果 */
        .clock-face::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%);
            pointer-events: none;
            z-index: 60;
        }

        /* 指針共同樣式 */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            z-index: 10;
            will-change: transform;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .hand.hour {
            width: 10px;
            height: 75px;
            background-color: #111;
            margin-left: -5px;
            z-index: 20;
            border-radius: 4px;
        }

        .hand.minute {
            width: 6px;
            height: 105px;
            background-color: #333;
            margin-left: -3px;
            z-index: 30;
            border-radius: 3px;
        }

        .hand.second {
            width: 2px;
            height: 120px;
            background-color: #cc0000;
            margin-left: -1px;
            z-index: 40;
            border-radius: 0; 
            border: none;
        }
        
        .hand.second::after {
            content: '';
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 35px;
            background-color: #cc0000;
            border-radius: 4px;
        }
        
        .hand.second::before {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background-color: #cc0000;
            border-radius: 50%;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .center-nut {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 30% 30%, #e6e6e6, #888);
            border-radius: 50%;
            z-index: 50;
            pointer-events: none;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }

        /* 刻度與數字容器 */
        #markers-layer, #numbers-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* 修正後的刻度樣式：移除了 transform-origin */
        .marker {
            position: absolute;
            background-color: #333;
            width: 2px;
            height: 12px;
            left: 50%;
            margin-left: -1px;
            /* 移除 transform-origin 以修復定位問題 */
            pointer-events: none;
        }

        .marker.main {
            background-color: #000;
            width: 6px;
            height: 18px;
            margin-left: -3px;
            border-radius: 1px;
        }

        .clock-number {
            position: absolute;
            width: 40px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            color: #111;
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            font-size: 1.6rem;
            top: 50%;
            left: 50%;
            margin-top: -20px;
            margin-left: -20px;
            pointer-events: none;
            z-index: 5;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        .glass-panel {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 開關樣式 */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #68D391;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #68D391;
        }
    </style>
</head>
<body>

    <div class="flex flex-col items-center gap-6">
        
        <!-- 時鐘本體 -->
        <div class="clock-rim">
            <div id="clock-face" class="clock-face">
                
                <!-- 刻度層 -->
                <div id="markers-layer"></div>
                <!-- 數字層 -->
                <div id="numbers-layer"></div>

                <!-- 指針 -->
                <div class="hand hour" id="hour-hand"></div>
                <div class="hand minute" id="minute-hand"></div>
                <div class="hand second" id="second-hand"></div>
                
                <div class="center-nut"></div>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="glass-panel px-6 py-4 rounded-xl shadow-lg text-center w-[320px]">
            <!-- 時間顯示 -->
            <div id="digital-time" class="text-3xl font-mono text-white font-bold tabular-nums tracking-wider mb-1">00:00:00</div>
            <div id="digital-date" class="text-xs text-gray-400 mb-4 font-light uppercase tracking-widest">Loading...</div>
            
            <!-- 分隔線 -->
            <div class="h-px bg-gray-600 w-full mb-4 opacity-50"></div>

            <!-- 控制選項 -->
            <div class="flex flex-col gap-3">
                
                <!-- 上傳背景按鈕 -->
                <label class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    更換錶面背景 (上傳照片)
                    <input type="file" id="bg-upload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                </label>

                <!-- 開關區 -->
                <div class="flex justify-between px-2 mt-1">
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="toggle-markers" class="w-4 h-4 rounded text-blue-500 focus:ring-blue-500 bg-gray-700 border-gray-600" checked onchange="toggleLayer('markers-layer', this.checked)">
                        <label for="toggle-markers" class="text-gray-300 text-xs">顯示刻度</label>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="toggle-numbers" class="w-4 h-4 rounded text-blue-500 focus:ring-blue-500 bg-gray-700 border-gray-600" checked onchange="toggleLayer('numbers-layer', this.checked)">
                        <label for="toggle-numbers" class="text-gray-300 text-xs">顯示數字</label>
                    </div>
                </div>

                <div class="flex justify-between items-center mt-2 pt-2 border-t border-gray-700/50">
                    <button onclick="resetTime()" class="text-xs text-gray-400 hover:text-white transition-colors underline">
                        重置時間
                    </button>
                    <button onclick="clearBackground()" class="text-xs text-red-400 hover:text-red-300 transition-colors">
                        移除背景
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM 元素
        const clockFace = document.getElementById('clock-face');
        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');
        const secondHand = document.getElementById('second-hand');
        const digitalTimeDisplay = document.getElementById('digital-time');
        const digitalDateDisplay = document.getElementById('digital-date');
        const markersLayer = document.getElementById('markers-layer');
        const numbersLayer = document.getElementById('numbers-layer');

        let timeOffset = 0;
        let isDragging = false;
        let lastDragAngle = 0;

        // 初始化刻度與數字
        function createClockElements() {
            const faceRadius = 145;
            const markerRadius = 132;
            const numberRadius = 108;

            // 清空
            markersLayer.innerHTML = '';
            numbersLayer.innerHTML = '';

            // 1. 刻度
            for (let i = 0; i < 60; i++) {
                const isMain = i % 5 === 0;
                const marker = document.createElement('div');
                marker.classList.add('marker');
                if (isMain) marker.classList.add('main');
                
                marker.style.top = '50%';
                marker.style.left = '50%';
                marker.style.marginTop = isMain ? '-9px' : '-6px'; 
                // 修正：現在 CSS 沒有 transform-origin，這裡的 translate 會正確生效
                marker.style.transform = `rotate(${i * 6}deg) translate(0, -${markerRadius}px)`;
                markersLayer.appendChild(marker);
            }

            // 2. 數字
            for (let i = 1; i <= 12; i++) {
                const numberEl = document.createElement('div');
                numberEl.classList.add('clock-number');
                numberEl.textContent = i;
                const angle = i * 30;
                numberEl.style.transform = `rotate(${angle}deg) translate(0, -${numberRadius}px) rotate(-${angle}deg)`;
                numbersLayer.appendChild(numberEl);
            }
        }

        // 時間邏輯
        function updateClock() {
            const now = new Date(Date.now() + timeOffset);
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();
            const milliseconds = now.getMilliseconds();

            const secondDegrees = ((seconds + milliseconds / 1000) / 60) * 360;
            const minuteDegrees = ((minutes + seconds / 60) / 60) * 360;
            const hourDegrees = ((hours % 12 + minutes / 60) / 12) * 360;

            secondHand.style.transform = `rotate(${secondDegrees}deg)`;
            minuteHand.style.transform = `rotate(${minuteDegrees}deg)`;
            hourHand.style.transform = `rotate(${hourDegrees}deg)`;

            updateDigitalDisplay(now);
            requestAnimationFrame(updateClock);
        }

        function updateDigitalDisplay(dateObj) {
            const h = dateObj.getHours().toString().padStart(2, '0');
            const m = dateObj.getMinutes().toString().padStart(2, '0');
            const s = dateObj.getSeconds().toString().padStart(2, '0');
            digitalTimeDisplay.textContent = `${h}:${m}:${s}`;
            const options = { year: 'numeric', month: 'short', day: 'numeric', weekday: 'short' };
            digitalDateDisplay.textContent = dateObj.toLocaleDateString('en-US', options);
        }

        // 圖片上傳處理
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    clockFace.style.backgroundImage = `url(${e.target.result})`;
                };
                reader.readAsDataURL(file);
            }
        }

        function clearBackground() {
            clockFace.style.backgroundImage = 'none';
            document.getElementById('bg-upload').value = ''; // Reset input
        }

        // 圖層開關
        function toggleLayer(layerId, isVisible) {
            const layer = document.getElementById(layerId);
            layer.style.display = isVisible ? 'block' : 'none';
        }

        // 互動邏輯 (拖曳)
        function getAngleFromCenter(clientX, clientY) {
            const rect = clockFace.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const dx = clientX - centerX;
            const dy = clientY - centerY;
            let rad = Math.atan2(dy, dx);
            let deg = rad * (180 / Math.PI);
            deg += 90;
            if (deg < 0) deg += 360;
            return deg;
        }

        function handleStart(clientX, clientY) {
            isDragging = true;
            lastDragAngle = getAngleFromCenter(clientX, clientY);
            clockFace.style.cursor = 'grabbing';
            minuteHand.style.transition = 'none';
            hourHand.style.transition = 'none';
        }

        function handleMove(clientX, clientY) {
            if (!isDragging) return;
            const currentAngle = getAngleFromCenter(clientX, clientY);
            let delta = currentAngle - lastDragAngle;
            if (delta < -180) delta += 360;
            if (delta > 180) delta -= 360;
            timeOffset += delta * 10000;
            lastDragAngle = currentAngle;
        }

        function handleEnd() {
            isDragging = false;
            clockFace.style.cursor = 'grab';
        }

        clockFace.addEventListener('mousedown', e => { e.preventDefault(); handleStart(e.clientX, e.clientY); });
        window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', handleEnd);

        clockFace.addEventListener('touchstart', e => { e.preventDefault(); handleStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
        window.addEventListener('touchmove', e => handleMove(e.touches[0].clientX, e.touches[0].clientY), { passive: false });
        window.addEventListener('touchend', handleEnd);

        window.resetTime = function() { timeOffset = 0; };

        // 啟動
        createClockElements();
        requestAnimationFrame(updateClock);

    </script>
</body>
</html>
